name: CI/CD Pipeline

on:
  push:
    branches:
      - 'feature/*'
      - develop
      - main
  pull_request:
    branches:
      - develop

jobs:

  # ── Step 1: Always runs — install and test ─────────────────────────────────
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  # ── Step 2: Build image and push to Docker Hub ────────────────────────────
  # Only runs on merge to develop or main
  push-to-dockerhub:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: |
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" \
          | docker login -u ${{ variables.DOCKER_USERNAME }} --password-stdin

      - name: Build Docker images
        run: |
          docker build -t ${{ variables.DOCKER_USERNAME }}/frontend:${{ github.sha }} ./frontend
          docker build -t ${{ variables.DOCKER_USERNAME }}/backend:${{ github.sha }}  ./backend

      - name: Push images to Docker Hub
        run: |
          docker push ${{ variables.DOCKER_USERNAME }}/frontend:${{ github.sha }}
          docker push ${{ variables.DOCKER_USERNAME }}/backend:${{ github.sha }}

  # ── Step 3: Pull from Docker Hub and push to ECR ─────────────────────────
  # Runs after Step 2, only on merge to develop or main
  push-to-ecr:
    runs-on: ubuntu-latest
    needs: push-to-dockerhub
    steps:
      - name: Login to Docker Hub
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" \
          | docker login -u ${{ variables.DOCKER_USERNAME }} --password-stdin

      - name: Pull images from Docker Hub
        run: |
          docker pull ${{ variables.DOCKER_USERNAME }}/frontend:${{ github.sha }}
          docker pull ${{ variables.DOCKER_USERNAME }}/backend:${{ github.sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region ap-south-1 \
          | docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}

      - name: Tag and push images to ECR
        run: |
          docker tag ${{ variables.DOCKER_USERNAME }}/frontend:${{ github.sha }} ${{ secrets.ECR_REGISTRY }}/frontend:${{ github.sha }}
          docker tag ${{ variables.DOCKER_USERNAME }}/backend:${{ github.sha }}  ${{ secrets.ECR_REGISTRY }}/backend:${{ github.sha }}
          docker push ${{ secrets.ECR_REGISTRY }}/frontend:${{ github.sha }}
          docker push ${{ secrets.ECR_REGISTRY }}/backend:${{ github.sha }}

  # ── Step 4: Deploy from ECR to ECS ────────────────────────────────────────
  # Only runs on merge to main
  deploy:
    runs-on: ubuntu-latest
    needs: push-to-ecr
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Deploy frontend to ECS
        run: |
          aws ecs update-service \
            --cluster myCluster \
            --service myFrontendService \
            --force-new-deployment

      - name: Deploy backend to ECS
        run: |
          aws ecs update-service \
            --cluster myCluster \
            --service myBackendService \
            --force-new-deployment